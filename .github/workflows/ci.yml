name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # dist/index.cjs is the committed artifact the action actually runs
      # (action.yml → node dist/index.cjs). Enforce that every PR ships a
      # dist rebuilt from its src — "src changed without rebuilding dist"
      # silently ships stale behavior. The check also rejects non-canonical
      # builds (e.g. ../../node_modules label prefixes from symlinked
      # worktree node_modules), keeping the bundle reproducible from a
      # clean checkout.
      - name: Verify dist is in sync with src
        run: |
          npm run build
          git diff --exit-code -- dist/
