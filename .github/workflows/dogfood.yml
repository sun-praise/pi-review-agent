name: dogfood-review

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post the review comment
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The action runs `node dist/index.cjs`, and dist/ is a committed build
      # artifact. Without this rebuild step, the self-review would run the
      # LAST committed dist — which can lag behind src when a PR changes source
      # without also rebuilding dist (this happened: the verifier PR merged
      # with src-only changes, and dist only caught up in a later PR). Building
      # here from the PR's own src guarantees the dogfood review exercises the
      # exact code under review. See discussion on the PR that added this step.
      #
      # Pin Node explicitly: tsup.config.ts targets "node22" and the build
      # toolchain (tsup/tsx) expects it. ubuntu-latest's default Node drifts
      # over time (~20.x today), which could break the build silently.
      # node-version-file + cache reads .nvmrc and speeds up repeat runs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Rebuild dist from this PR's src
        run: npm run build

      - name: Run pi-review-agent on this PR
        uses: ./
        with:
          team: "quality:1,security:1,performance:1"
          # This repo must commit dist/index.cjs (the action runs from it), so
          # every src change inflates the diff ~13 MB. Exclude it from the
          # self-review payload to stay under the LLM proxy body limit (#28).
          diff-exclude: "dist/**"
          # --- v1.6.0 feature smoke (this PR is a test vehicle; close after) ---
          # Per-role routing: reviewers stay on `model` (default
          # deepseek-v4-flash); coordinator + verifier switch to mimo-v2.5.
          # Expected in the job log: "[coordinator] trying model: mimo-v2.5"
          # while every persona logs deepseek-v4-flash, and no
          # "model not found in provider" (the fallback-registration fix).
          coordinator-model: "mimo-v2.5"
          verifier-model: "mimo-v2.5"
          # Per-model cost tables: mimo-v2.5 usage bills at these demo rates
          # instead of the DeepSeek-flash estimate. The review comment's cost
          # line should reflect them for the coordinator's share.
          cost-overrides: '{"mimo-v2.5":{"input":0.1,"output":0.3,"cacheRead":0.01}}'
          litellm-url: ${{ secrets.LITELLM_URL }}
          litellm-api-key: ${{ secrets.LITELLM_API_KEY }}
