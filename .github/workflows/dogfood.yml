name: dogfood-review

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post the review comment
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The action runs `node dist/index.cjs`, and dist/ is a committed build
      # artifact. Without this rebuild step, the self-review would run the
      # LAST committed dist — which can lag behind src when a PR changes source
      # without also rebuilding dist (this happened: the verifier PR merged
      # with src-only changes, and dist only caught up in a later PR). Building
      # here from the PR's own src guarantees the dogfood review exercises the
      # exact code under review. See discussion on the PR that added this step.
      #
      # Pin Node explicitly: tsup.config.ts targets "node22" and the build
      # toolchain (tsup/tsx) expects it. ubuntu-latest's default Node drifts
      # over time (~20.x today), which could break the build silently.
      # node-version-file + cache reads .nvmrc and speeds up repeat runs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Rebuild dist from this PR's src
        run: npm run build

      - name: Run pi-review-agent on this PR
        uses: ./
        with:
          # The MiMo family carries the tight param contract (completion cap
          # 131072) — v1.10.0 shipped a value only deepseek tolerated and a
          # deepseek-primary dogfood stayed green through it (ops issue
          # #126), so the self-review runs on MiMo.
          model: "mimo-v2.6-flash"
          # Disable the mimo-v2.5 fallback: with it, a persistently failing
          # primary silently degrades and the leg stays green on the wrong
          # model. The leg name must equal the model actually exercised.
          fallback-models: ""
          # Make the leg a real gate: exit 1 on blocking findings (which
          # includes fail-closed CANNOT MERGE verdicts) instead of always
          # exiting 0 and leaving only a comment (#82 review).
          fail-on-severity: "blocking"
          # Headroom over the 600s default for TIMEOUT-type slowness only:
          # thinking-on reviews on a loaded shared Token Plan can exceed
          # 600s per persona and fail-closed with no code fault (observed
          # 04:36 UTC). This does NOT help 429-type fail-closed failures
          # (04:20 UTC: concurrent runs rate-limited each other) — those
          # rerun off-peak, don't raise this again. Real failures still red
          # via fail-on-severity: blocking; this only tolerates
          # slow-but-successful reviews.
          timeout-seconds: 900
          team: "quality:1,security:1,performance:1"
          # This repo must commit dist/index.cjs (the action runs from it), so
          # every src change inflates the diff ~13 MB. Exclude it from the
          # self-review payload to stay under the LLM proxy body limit (#28).
          diff-exclude: "dist/**"
          litellm-url: ${{ secrets.LITELLM_URL }}
          litellm-api-key: ${{ secrets.LITELLM_API_KEY }}
