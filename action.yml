name: Pi Review Agent
description: >
  AI code review: N personas in parallel + coordinator, cross-runner resume,
  one PR comment. LiteLLM/DeepSeek.

branding:
  icon: 'search'
  color: 'blue'

inputs:
  github-token:
    description: >
      GitHub token used to fetch the PR diff and post the review comment.
      Defaults to `github.token`. Needs `pull-requests: write` scope to post
      the comment.
    required: false
    default: ${{ github.token }}
  pr:
    description: >
      PR number. Auto-detected from `GITHUB_REF` on `pull_request` events.
      Set explicitly for other triggers (workflow_dispatch, schedule).
    required: false
    default: ""
  team:
    description: >
      Multi-persona mode. Comma-separated list of `persona:count` pairs.

      Built-in personas: quality, security, performance, architecture,
      regression-test, test-value. Custom personas can be added via
      `.github/reviewers/*.{yml,yaml}` in the target repo.

      Each persona runs in parallel as its own session; a coordinator then
      synthesizes all outputs into a single verdict (CAN MERGE / CONDITIONAL
      MERGE / CANNOT MERGE) and posts one PR comment.

      Example: `quality:1,security:1,performance:1`

      Count >1 is accepted for spec compatibility with opencode-actions but
      currently runs as 1.
    required: false
    default: ""
  persona:
    description: >
      Single-persona mode (used when `team` is empty). Runs one reviewer with
      no coordinator and no PR comment (output goes to step summary only).
      Default "quality".
    required: false
    default: "quality"
  skip-coordinator:
    description: >
      Skip the coordinator synthesis step. Only affects team mode. When true,
      the verdict output falls back to persona severity vote.
    required: false
    default: "false"
  language:
    description: >
      Output language for review prose (summary, findings, suggestions).
      Accepts short codes (zh, en, ja, ko, fr, de, es, ru) or full names
      (中文, English, 日本語). Default "zh" (中文). The verdict keywords
      (CAN MERGE / CONDITIONAL MERGE / CANNOT MERGE) always stay in English
      uppercase — they are parsed by machine and never translated.
    required: false
    default: "zh"
  litellm-url:
    description: >
      Base URL of a LiteLLM proxy or any OpenAI-compatible chat completions
      endpoint. Trailing `/v1` is optional. Example:
      `https://llm.example.com` or `https://llm.example.com/v1`.
    required: false
    default: ""
  litellm-api-key:
    description: API key for the LiteLLM / OpenAI-compatible endpoint.
    required: false
    default: ""
  model:
    description: >
      Model id to request from the endpoint. Defaults to `deepseek-v4-flash`.
      Change this if your proxy routes a different model name.
    required: false
    default: "deepseek-v4-flash"
  sessions-root:
    description: >
      Directory used to persist per-PR review sessions across runs (the
      resume cache). Defaults to a runner-temp path; override to point at a
      mounted volume if you skip `actions/cache`.
    required: false
    default: ""
  working-directory:
    description: >
      Repository checkout path for the reviewer's read/grep tools. Defaults
      to `github.workspace`.
    required: false
    default: ""
  timeout-seconds:
    description: >
      Per-reviewer hard timeout in seconds. On expiry the attempt fails and,
      if the error is transient (network blip), retries. Set 0 to disable
      (not recommended). Default 600.
    required: false
    default: "600"
  max-attempts:
    description: >
      Max attempts per reviewer. A transient upstream error triggers a
      fresh-session retry with exponential backoff + jitter. Default 3.
    required: false
    default: "3"
  retry-backoff-ms:
    description: >
      Base milliseconds for exponential backoff between retries.
      Backoff = base * 2^(attempt-1) + jitter[0, base]. Default 1000.
    required: false
    default: "1000"
  diff-exclude:
    description: >
      Comma-separated glob patterns for additional files to exclude from the
      review diff (e.g. "*.generated.ts,vendor/**"). Lock files are always
      excluded automatically. Patterns without "/" match the file basename;
      patterns with "/" match the full file path (gitignore convention).
    required: false
    default: ""
  diff-max-size-kb:
    description: >
      Maximum diff size in kilobytes after filtering. If exceeded, only the
      leading file sections are kept and a truncation notice is appended.
      Set 0 (default) to disable truncation.
    required: false
    default: "0"
  fail-on-severity:
    description: >
      Control the action exit code based on review severity. Allowed values:
      "none" (default — always exit 0), "blocking" (exit 1 if blocking
      issues found), "warning" (exit 1 if warning or blocking issues found).
      Fail-closed: unparseable coordinator output or a missing reviewer
      forces failure whenever the gate is armed.
    required: false
    default: "none"

outputs:
  verdict:
    description: >
      Final review verdict: `CAN MERGE`, `CONDITIONAL MERGE`, `CANNOT MERGE`,
      or `UNKNOWN`. In team mode this is the coordinator's verdict (with
      persona severity vote as fallback). In single mode it echoes the
      reviewer's first line.
    value: ${{ steps.review.outputs.verdict }}
  cacheRead:
    description: >
      Total `cacheRead` tokens across all reviewers and coordinator for this
      run. Non-zero means the upstream's prompt cache was hit (discounted
      billing).
    value: ${{ steps.review.outputs.totalCacheRead }}
  totalCost:
    description: Total USD cost across all reviewers and coordinator.
    value: ${{ steps.review.outputs.totalCost }}

runs:
  using: composite
  steps:
    - name: Detect PR number
      id: pr
      shell: bash
      env:
        INPUT_PR: ${{ inputs.pr }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        pr="${INPUT_PR}"
        if [[ -z "$pr" ]]; then
          if [[ "$GITHUB_REF" =~ refs/pull/([0-9]+)/ ]]; then
            pr="${BASH_REMATCH[1]}"
          fi
        fi
        echo "pr=$pr" >> "$GITHUB_OUTPUT"

    - name: Fetch PR diff
      id: diff
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR: ${{ steps.pr.outputs.pr }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/pi-review-diff.txt"
        : > "$out"
        if [[ -z "$PR" ]]; then
          echo "no PR number detected; diff empty" >&2
          echo "file=$out" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if command -v gh >/dev/null 2>&1; then
          gh pr diff "$PR" > "$out" 2>/dev/null || true
        fi
        if [[ ! -s "$out" ]]; then
          api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/pulls/${PR}.diff"
          curl -sSf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github.v3.diff" \
               "$api" > "$out" 2>/dev/null || true
        fi
        echo "file=$out" >> "$GITHUB_OUTPUT"

    - name: Restore review session
      id: session
      if: ${{ steps.pr.outputs.pr != '' }}
      uses: actions/cache@v5
      with:
        path: ${{ inputs.sessions-root != '' && inputs.sessions-root || format('{0}/.pi-review-sessions', runner.temp) }}
        # Key per (repo, pr) so each PR gets its own session cache. The
        # persona/team is encoded into filenames inside sessions-root, so one
        # cache entry holds all reviewers for that PR.
        key: pi-review-session-${{ github.repository }}-${{ steps.pr.outputs.pr }}-${{ github.run_id }}
        restore-keys: |
          pi-review-session-${{ github.repository }}-${{ steps.pr.outputs.pr }}-

    - name: Run review
      id: review
      shell: bash
      env:
        PI_REVIEW_PR: ${{ steps.pr.outputs.pr }}
        PI_REVIEW_DIFF_FILE: ${{ steps.diff.outputs.file }}
        PI_REVIEW_PERSONA: ${{ inputs.team == '' && inputs.persona || '' }}
        PI_REVIEW_TEAM: ${{ inputs.team }}
        PI_REVIEW_SKIP_COORDINATOR: ${{ inputs.skip-coordinator }}
        PI_REVIEW_MODEL: ${{ inputs.model }}
        PI_REVIEW_LANGUAGE: ${{ inputs.language }}
        PI_REVIEW_SESSIONS_ROOT: ${{ inputs.sessions-root != '' && inputs.sessions-root || format('{0}/.pi-review-sessions', runner.temp) }}
        LITELLM_BASE_URL: ${{ inputs.litellm-url }}
        LITELLM_API_KEY: ${{ inputs.litellm-api-key }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PI_REVIEW_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        PI_REVIEW_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        PI_REVIEW_RETRY_BACKOFF_MS: ${{ inputs.retry-backoff-ms }}
        PI_REVIEW_DIFF_EXCLUDE: ${{ inputs.diff-exclude }}
        PI_REVIEW_DIFF_MAX_SIZE_KB: ${{ inputs.diff-max-size-kb }}
        PI_REVIEW_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        # PR comment posting reads these:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REF: ${{ github.ref }}
        PI_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        cd "${WORKING_DIRECTORY:-$GITHUB_WORKSPACE}"
        node "${{ github.action_path }}/dist/index.cjs"
